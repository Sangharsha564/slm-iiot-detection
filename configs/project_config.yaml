# ── Project Configuration ─────────────────────────────────────────
project:
  name: "slm-iiot-detection"
  version: "1.0.0"
  seed: 42

# ── Paths ─────────────────────────────────────────────────────────
paths:
  dataset_dir:      "dataset"
  raw_csv:          "dataset/combined_shuffled.csv"
  preprocessed_dir: "dataset/preprocessed"
  models_dir:       "models"
  xgboost_dir:      "models/xgboost"
  slm_dir:          "models/encoder_slm"
  logs_dir:         "logs"
  reports_dir:      "reports"
  figures_dir:      "reports/figures"

# ── Dataset ───────────────────────────────────────────────────────
dataset:
  n_classes:    8
  n_features:   20           # after combined XGBoost+MI feature selection
  test_size:    0.2
  random_state: 42
  label_map:
    0: "benign"
    1: "slowloris"
    2: "dos_other"
    3: "ddos_other"
    4: "recon"
    5: "mitm"
    6: "malware"
    7: "other"

# ── XGBoost Gate ──────────────────────────────────────────────────
xgboost:
  n_estimators:      500
  max_depth:         6
  learning_rate:     0.05
  subsample:         0.8
  colsample_bytree:  0.8
  scale_pos_weight:  226
  eval_metric:       "mlogloss"
  nthread:           -1
  random_state:      42

# ── Encoder SLM ───────────────────────────────────────────────────
encoder_slm:
  base_model:       "distilbert-base-uncased"
  max_length:       128
  batch_size:       32
  num_epochs:       10
  learning_rate:    2.0e-5
  warmup_steps:     100
  weight_decay:     0.01
  mixed_precision:  "bf16"
  lora_r:           8
  lora_alpha:       16
  lora_dropout:     0.1

# ── MLflow ────────────────────────────────────────────────────────
mlflow:
  experiment_xgboost: "xgboost-gate"
  experiment_slm:     "encoder-slm"
